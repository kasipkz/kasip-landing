<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b45">
  <meta name="description" content="KASIP.KZ — кәсібіңді онлайнға шығар. Сайтыңды 5 минутта жаса!">
  <title>KASIP.KZ — Кәсібіңді онлайнға шығар!</title>
  <style>
    :root{color-scheme:dark;--bg:#061638;--blue:#1769ff;--cyan:#55d6ff;--white:#f7fbff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--white);
      background:radial-gradient(ellipse at 50% 0%,#164b9d 0%,#0b2b62 34%,var(--bg) 75%);
      display:flex;align-items:center;justify-content:center;padding:26px 16px}
    .page{width:min(100%,480px);text-align:center}
    .logo{font-size:clamp(38px,10vw,58px);font-weight:900;letter-spacing:-2px;margin:8px 0 10px}
    .logo span{color:var(--cyan)}
    .tag{font-size:clamp(23px,6vw,32px);line-height:1.18;font-weight:800;margin:12px 0}
    .sub{font-size:16px;color:#d5e5ff;line-height:1.55;margin:0 auto 24px;max-width:340px}
    .visual{height:150px;display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 22px}
    .device{border:2px solid #9bcaff;background:linear-gradient(145deg,#fff,#d9eaff);color:#10234b;
      border-radius:18px;box-shadow:0 16px 45px #0008;display:flex;align-items:center;justify-content:center}
    .laptop{width:190px;height:118px;font-size:17px;font-weight:900;transform:rotate(-4deg)}
    .phone{width:64px;height:116px;border-radius:14px;font-size:24px;transform:rotate(7deg)}
    .offer{background:linear-gradient(100deg,#ffdc55,#ff9d26);color:#18254a;font-weight:900;
      padding:13px 16px;border-radius:15px;margin:0 auto 18px;max-width:360px;box-shadow:0 8px 25px #0004}
    .btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:17px 18px;
      border-radius:16px;text-decoration:none;font-size:17px;font-weight:800;margin:12px 0;
      transition:transform .15s,filter .15s}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .telegram{background:linear-gradient(110deg,#27a9e8,#1769ff);color:white;box-shadow:0 10px 28px #087bdf55}
    .website{background:#ffffff;color:#10234b}
    .tg-icon{font-size:23px}
    .small{font-size:12px;color:#a9c3e9;margin-top:22px}
    .features{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0}
    .feature{font-size:12px;color:#dceaff;background:#ffffff12;border:1px solid #ffffff20;padding:9px 11px;border-radius:30px}
    @media(max-width:360px){.tag{font-size:22px}.btn{font-size:15px}.visual{height:125px}.laptop{width:160px;height:100px}}
    .notice{background:#FFE500;color:#000;text-align:center;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.4;border-radius:12px;margin:0 auto 16px;max-width:480px}
  </style>
</head>
<body>
<main class="page">
    <div class="notice">Сілтеме профильде! Ашылмай тұрса: сілтемені бас, жоғарыдағы 3 нүктені бас, Браузерде ашуды таңда. Сайт ашылады! Тапсырыс беру үшін бізге жазыңыз, жауап береміз!</div>
    <div class="logo">KASIP<span>.KZ</span></div>
    <h1 class="tag">Кәсібіңді онлайнға шығар! 🚀</h1>
    <p class="sub">Сайтың 5 минутта дайын!<br>Бағдарламалау білудің қажеті жоқ.</p>

    <div class="visual" aria-label="Ноутбук пен телефондағы сайт">
      <div class="device laptop">KASIP.KZ<br><small>Өз сайтыңды жаса!</small></div>
      <div class="device phone">🌐</div>
    </div>
